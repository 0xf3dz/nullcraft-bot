[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nullcraft-bot"
version = "1.0.0"
description = "Telegram alerts for large Polymarket trades"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.14.3",
    "python-dotenv==1.2.2",
    "python-telegram-bot==22.8",
]

[project.scripts]
nullcraft = "nullcraft.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["nullcraft"]
